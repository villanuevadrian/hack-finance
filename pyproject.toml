[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "behaviorlab"
version = "0.0.1"
description = "BehaviorLab: perfil conductual de inversión a partir de un juego corto (Hack Finance 2026)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "httpx>=0.27",  # required by fastapi.testclient
]

# Three top-level packages from two roots, without moving folders:
#   contracts/            -> import contracts
#   backend/behaviorlab/  -> import behaviorlab
#   backend/api/          -> import api
[tool.setuptools.packages.find]
where = [".", "backend"]
include = ["contracts*", "behaviorlab*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.ruff.lint.isort]
known-first-party = ["contracts", "behaviorlab", "api"]
